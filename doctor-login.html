<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>医生登录 - AI 智能医生</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <aside class="login-brand key-doctor" aria-label="医生端介绍">
        <div class="brand-panel">
          <span class="brand-accent"></span>

          <div class="logo login-logo">
            <span class="logo-mark">+</span>
            <span>AIDoctor</span>
          </div>

          <div class="brand-badge">医生工作台</div>

          <h1>每一次开方<br />都有据可查</h1>
          <p>
            患者档案、用药方案与随访记录集中管理，<br />
            开方前自动做相互作用与剂量安全预检。
          </p>

          <ul class="brand-points">
            <li>电子病历</li>
            <li>用药方案</li>
            <li>安全预检</li>
            <li>反馈处理</li>
          </ul>
        </div>
      </aside>

      <div class="login-card">
        <div class="login-header">
          <div class="logo login-logo">
            <span class="logo-mark">+</span>
            <span>AIDoctor · 医生端</span>
          </div>
          <p>AIDoctor · 医生工作台</p>
        </div>

        <form id="doctorLoginForm" class="login-form auth-form active">
          <div class="form-header">
            <h2>医生登录</h2>
          </div>
          <div class="form-group">
            <input name="username" type="text" placeholder="医生账号" />
          </div>
          <div class="form-group">
            <input name="password" type="password" placeholder="密码" />
          </div>
          <button type="submit" class="primary-btn login-btn">登录</button>
          <p id="doctorLoginMsg" class="login-error" aria-live="polite"></p>
          <p class="demo-tip">
            还没有账号？<a href="doctor-register.html" style="color: var(--primary-dark)">医生注册</a>
            · <a href="login.html" style="color: var(--primary-dark)">患者登录</a>
          </p>
        </form>
      </div>
    </div>

    <p class="login-foot">© 2026 AIDoctor · 医生工作台</p>

    <script src="script.js"></script>
  </body>
</html>
