<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="styles.css" />

    <header class="topbar">
      <div class="container nav-wrap">
        <div class="logo">
          <span class="logo-mark">+</span>

        <nav class="nav">
          <a href="index.html">首页</a>
          <a href="medicine.html">药品</a>

        <div class="header-actions">

    <main>

    <footer class="footer">
      <div class="container footer-inner">
        <div>© 2026 AIDoctor · 健康管理平台</div>
        <div>AI诊断仅供参考，严重症状请及时就医</div>
