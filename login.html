<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - AIDoctor · AI 智能诊疗助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <aside class="login-brand" aria-label="项目介绍">
        <div class="brand-panel">
          <div class="logo login-logo">
            <span class="logo-mark">A</span>
            <span>AIDoctor</span>
          </div>

          <div class="brand-badge">AI 智能诊疗</div>

          <h1>欢迎来到<br />AIDoctor 智能诊疗平台</h1>
          <p>智能问诊，便捷健康管理</p>

          <ul class="brand-points">
            <li>疾病百科</li>
            <li>药品查询</li>
            <li>拍照识药</li>
          </ul>
        </div>
      </aside>

      <div class="login-card">
        <button type="button" class="scan-btn" aria-label="扫码登录">◌</button>

        <div class="login-header">
          <div class="logo login-logo">
            <span class="logo-mark">A</span>
            <span>AIDoctor</span>
          </div>
          <p id="authSubtitle">欢迎来到 AIDoctor 智能诊疗平台</p>
        </div>

        <div class="auth-switch" aria-label="登录注册切换">
          <button type="button" class="switch-btn active" data-mode="login">登录</button>
          <button type="button" class="switch-btn" data-mode="register">注册</button>
        </div>

        <form id="loginForm" class="login-form auth-form active">
          <div class="form-header">
            <h2>登录</h2>
          </div>

          <div class="form-group phone-group">
            <input id="username" name="username" type="text" placeholder="账号" />
          </div>

          <div class="form-group">
            <input id="password" name="password" type="password" placeholder="密码" />
          </div>

          <label class="remember-box agreement-box">
            <input type="checkbox" checked />
            <span>登录即代表同意</span>
            <a href="#">AIDoctor 服务协议</a>
            <span>和</span>
            <a href="#">隐私保护声明</a>
          </label>

          <button type="submit" class="primary-btn login-btn">登录</button>
          <p id="loginError" class="login-error" aria-live="polite"></p>
        </form>

        <form id="registerForm" class="login-form auth-form">
          <div class="form-header">
            <h2>注册</h2>
          </div>

          <div class="form-group">
            <input id="registerUsername" name="registerUsername" type="text" placeholder="手机号码" />
          </div>

          <div class="form-group">
            <input id="registerPassword" name="registerPassword" type="password" placeholder="请输入密码" />
          </div>

          <div class="form-group">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="请再次输入密码" />
          </div>

          <button type="submit" class="primary-btn login-btn">立即注册</button>
          <p class="demo-tip">注册成功后可直接登录使用</p>
          <p id="registerError" class="login-error" aria-live="polite"></p>
        </form>

        <p class="demo-tip">
          <a href="doctor-login.html" style="color: var(--primary-dark)">医生入口 →</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
